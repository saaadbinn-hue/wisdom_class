<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <style>
        table {
            width: 90%;
            margin: 30px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #0d6efd;
            color: white;
        }
    </style>
</head>

<body>

<h1 style="text-align:center;">
    Coaching Institute Admin Dashboard
</h1>

<table>

<tr>
    <th>Name</th>
    <th>Phone</th>
    <th>Email</th>
    <th>Course</th>
    <th>Message</th>
</tr>


{% for enquiry in enquiries %}

<tr>
    <td>{{ enquiry.full_name }}</td>
    <td>{{ enquiry.phone_number }}</td>
    <td>{{ enquiry.email }}</td>
    <td>{{ enquiry.course }}</td>
    <td>{{ enquiry.message }}</td>
</tr>

{% empty %}

<tr>
    <td colspan="5">
        No enquiries found
    </td>
</tr>

{% endfor %}


</table>

</body>
</html>
