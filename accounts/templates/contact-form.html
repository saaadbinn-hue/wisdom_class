<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coaching Institute Enquiry Form</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      .body {
        background: #f4f7fb;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 15px;
      }

      .container {
        width: 100%;
        max-width: 700px;
        background: #fff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      }

      .form-head {
        text-align: center;
        color: rgb(13 110 253);
        margin-bottom: 25px;
      }

      .form-div-heading {
        color: #333;
        margin: 20px 0 10px;
        border-bottom: 2px solid #1e3a8a;
        padding-bottom: 5px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 15px;
      }

      textarea {
        resize: vertical;
      }

      .radio-group {
        display: flex;
        gap: 20px;
        margin-top: 8px;
        flex-wrap: wrap;
      }

      .radio-group label {
        font-weight: normal;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      button {
        width: 100%;
        background-color: rgba(255, 193, 7, 1);
        color: white;
        border: none;
        padding: 14px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 15px;
        transition:
          background-color 0.3s ease,
          transform 0.2s ease;
      }

      button:hover {
        background-color: rgb(188, 149, 33);
        transform: translateY(-2px);
      }

      button:active {
        transform: translateY(0);
      }

      .required {
        color: red;
      }
      .success-message {
        background-color: #d4edda;
        color: #09aa2e;
        padding: 12px;
        border-radius: 5px;
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        text-align:center;
      }
    </style>
  </head>

  <body>
    {% include 'navbar.html' %} {% if success %}
    <div class="success-message">{{ success }}</div>
    {% endif %}

    <div class="body">
      <div class="container">
        <h2 class="form-head">Coaching Institute Enquiry Form</h2>

        <form method="post">
          {% csrf_token %}

          <h3 class="form-div-heading">Student Details</h3>

          <div class="form-group">
            <label> Full Name <span class="required">*</span> </label>
            <input type="text" name="full_name" required />
          </div>

          <div class="form-group">
            <label>Gender</label>

            <div class="radio-group">
              <label>
                <input type="radio" name="gender" value="Male" />
                Male
              </label>

              <label>
                <input type="radio" name="gender" value="Female" />
                Female
              </label>

              <label>
                <input type="radio" name="gender" value="Other" />
                Other
              </label>
            </div>
          </div>

          <div class="form-group">
            <label> Mobile Number <span class="required">*</span> </label>

            <input type="tel" name="phone_number" required />
          </div>

          <div class="form-group">
            <label>Email Address</label>

            <input type="email" name="email" />
          </div>

          <div class="form-group">
            <label> City / Location <span class="required">*</span> </label>

            <input type="text" name="city" required />
          </div>

          <h3 class="form-div-heading">Academic Details</h3>

          <div class="form-group">
            <label>
              Current Class / Qualification
              <span class="required">*</span>
            </label>

            <input type="text" name="class" required />
          </div>

          <div class="form-group">
            <label>School / College Name</label>

            <input type="text" name="school" />
          </div>

          <h3 class="form-div-heading">Course Enquiry</h3>

          <div class="form-group">
            <label>
              Course Interested In <span class="required">*</span>
            </label>

            <select name="course" required>
              <option value="">-- Select Course --</option>

              <option value="JMI Entrance">JMI Entrance</option>

              <option value="AMU Entrance">AMU Entrance</option>

              <option value="English Speaking">English Speaking</option>

              <option value="6th to 10th Coaching">6th to 10th Coaching</option>
            </select>
          </div>

          <div class="form-group">
            <label>Preferred Batch Timing</label>

            <select name="batch">
              <option value="Morning">Morning</option>

              <option value="Afternoon">Afternoon</option>

              <option value="Evening">Evening</option>
            </select>
          </div>

          <div class="form-group">
            <label>Mode of Learning</label>

            <select name="mode">
              <option value="Online">Online</option>

              <option value="Offline">Offline</option>

              <option value="Hybrid">Hybrid</option>
            </select>
          </div>

          <div class="form-group">
            <label>Your Query</label>

            <textarea name="message" rows="4"></textarea>
          </div>

          <button type="submit">Submit Enquiry</button>
        </form>
      </div>
    </div>

    {% include 'footer.html' %}
  </body>
</html>
